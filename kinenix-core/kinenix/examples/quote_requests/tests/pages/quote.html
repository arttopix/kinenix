<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motor Insurance Quote - Kinenix Demo Insurance</title>
<!--
  A made-up insurer for the Kinenix quote_requests example. The company, the cars it lists, and the prices are
  not real. The page behaves like modern quote sites: custom dropdowns with a search box, a cookie banner that
  appears late and covers the form, and the offered packages shown as cards.
-->
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6fa; color: #1b2433; }
  header { background: #143d59; color: #fff; padding: 14px 24px; }
  header h1 { margin: 0; font-size: 20px; }
  main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #dce2ec; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .classes { display: flex; gap: 10px; margin-bottom: 16px; }
  .class-option { flex: 1; padding: 14px; text-align: center; border: 2px solid #dce2ec; border-radius: 10px;
                  background: #fff; cursor: pointer; font-size: 15px; }
  .class-option[aria-checked="true"] { border-color: #1f7a5a; background: #eaf6f1; }
  .row { display: grid; grid-template-columns: 140px 1fr; align-items: center; gap: 10px; margin: 10px 0; }
  .dropdown { position: relative; }
  .dropdown > button { width: 100%; text-align: left; padding: 9px 12px; border: 1px solid #c4ccd9;
                       border-radius: 8px; background: #fff; cursor: pointer; }
  .popover { position: absolute; z-index: 5; top: 42px; left: 0; right: 0; background: #fff; border: 1px solid #c4ccd9;
             border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.12); padding: 6px; }
  .popover input { width: 100%; box-sizing: border-box; padding: 7px 9px; margin-bottom: 6px; border: 1px solid #dce2ec;
                   border-radius: 6px; }
  [role=option] { padding: 7px 9px; border-radius: 6px; cursor: pointer; }
  [role=option]:hover { background: #eef2f8; }
  .empty-list { padding: 7px 9px; color: #7a8496; }
  .repair label { margin-right: 16px; }
  #get-quote { margin-top: 12px; padding: 11px 22px; border: 0; border-radius: 8px; background: #1f7a5a; color: #fff;
               font-size: 15px; cursor: pointer; }
  #message { color: #b42318; margin-top: 10px; min-height: 1em; }
  #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .package-card { background: #fff; border: 1px solid #dce2ec; border-radius: 12px; padding: 16px; }
  .package-card h3 { margin: 0 0 8px; font-size: 16px; }
  .premium { font-size: 18px; font-weight: 700; color: #143d59; margin: 8px 0; }
  .detail { font-size: 13px; color: #4b5568; }
  #cookie-banner { position: fixed; left: 0; right: 0; bottom: 0; top: 30%; background: rgba(20, 61, 89, .96);
                   color: #fff; padding: 28px; display: none; z-index: 20; }
  #cookie-banner button { margin-top: 14px; padding: 9px 18px; border: 0; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<header><h1>Kinenix Demo Insurance</h1></header>
<main>
  <h2>Motor insurance quote</h2>
  <section class="card" id="form">
    <div class="classes" role="radiogroup" aria-label="Insurance class">
      <button class="class-option" data-testid="class-option" role="radio" aria-checked="false">Class 1</button>
      <button class="class-option" data-testid="class-option" role="radio" aria-checked="false">Class 2+</button>
      <button class="class-option" data-testid="class-option" role="radio" aria-checked="false">Class 3</button>
    </div>
    <div class="row"><span>Registration year</span><div class="dropdown" data-testid="year"></div></div>
    <div class="row"><span>Brand</span><div class="dropdown" data-testid="brand"></div></div>
    <div class="row"><span>Model</span><div class="dropdown" data-testid="model"></div></div>
    <div class="row"><span>Sub-model</span><div class="dropdown" data-testid="submodel"></div></div>
    <div class="row repair" data-testid="repair" hidden><span>Repair</span>
      <div><label><input type="radio" name="repair" value="Garage"> Garage</label>
           <label><input type="radio" name="repair" value="Dealer"> Dealer</label></div></div>
    <button id="get-quote" data-testid="get-quote">Get quote</button>
    <div id="message" role="alert"></div>
  </section>
  <section id="results" aria-live="polite"></section>
</main>
<div id="cookie-banner" role="dialog" aria-label="Cookies">
  <strong>This website uses cookies</strong>
  <p>We use cookies to remember your choices and to measure how the site is used.</p>
  <button id="accept-cookies">Accept all cookies</button>
</div>
<script>
  const CARS = {
    "HONDA": {"CITY": ["1.0 SV", "1.0 RS"], "HR-V": ["e:HEV E 1.5", "e:HEV RS"]},
    "MAZDA": {"CX-3": ["2.0 S", "2.0 SP"], "MAZDA2": ["1.3 C", "1.3 SP"]},
    "TOYOTA": {"COROLLA CROSS": ["1.8 HEV Premium", "1.8 HEV GR Sport"], "YARIS ATIV": ["1.2 Smart", "1.2 Premium"]}
  };
  const YEARS = ["2025", "2024", "2023", "2022", "2021", "2020"];
  const state = {cls: null, year: null, brand: null, model: null, submodel: null};

  // A custom dropdown: a button that opens a list of role=option items, optionally with a search box that filters it
  function dropdown(name, placeholder, items, searchable) {
    const box = document.querySelector(`[data-testid=${name}]`);
    box.innerHTML = "";
    const trigger = document.createElement("button");
    trigger.type = "button";
    trigger.setAttribute("aria-haspopup", "listbox");
    trigger.textContent = state[name] || placeholder;
    trigger.disabled = !items().length;
    box.appendChild(trigger);
    trigger.onclick = () => {
      document.querySelectorAll(".popover").forEach(p => p.remove());
      const pop = document.createElement("div");
      pop.className = "popover";
      const list = document.createElement("div");
      list.setAttribute("role", "listbox");
      let search = null;
      if (searchable) {
        search = document.createElement("input");
        search.setAttribute("cmdk-input", "");
        search.placeholder = "Search...";
        pop.appendChild(search);
      }
      pop.appendChild(list);
      const render = () => {
        const q = search ? search.value.trim().toLowerCase() : "";
        list.innerHTML = "";
        const shown = items().filter(i => i.toLowerCase().includes(q));
        if (!shown.length) list.innerHTML = '<div class="empty-list">No results</div>';
        shown.forEach(i => {
          const o = document.createElement("div");
          o.setAttribute("role", "option");
          o.textContent = i;
          o.onclick = () => { pick(name, i); pop.remove(); };
          list.appendChild(o);
        });
      };
      if (search) search.oninput = render;
      // The list arrives after a short delay, as when a site loads it from its server
      setTimeout(() => { render(); if (search) search.focus(); }, 150);
      box.appendChild(pop);
    };
  }

  function pick(name, value) {
    state[name] = value;
    if (name === "brand") { state.model = null; state.submodel = null; }
    if (name === "model") { state.submodel = null; }
    draw();
  }

  function draw() {
    dropdown("year", "Choose year", () => YEARS, false);
    dropdown("brand", "Choose brand", () => Object.keys(CARS), true);
    dropdown("model", "Choose model", () => state.brand ? Object.keys(CARS[state.brand]) : [], true);
    dropdown("submodel", "Choose sub-model",
             () => state.brand && state.model ? CARS[state.brand][state.model] : [], true);
    document.querySelector("[data-testid=repair]").hidden = state.cls !== "Class 1";
  }

  document.querySelectorAll(".class-option").forEach(b => b.onclick = () => {
    document.querySelectorAll(".class-option").forEach(x => x.setAttribute("aria-checked", "false"));
    b.setAttribute("aria-checked", "true");
    state.cls = b.textContent;
    draw();
  });

  // Made-up prices: the same choices always give the same packages
  function packages() {
    const base = {"Class 1": 14800, "Class 2+": 7200, "Class 3": 3400}[state.cls];
    const age = 2025 - Number(state.year);
    const car = (state.brand + state.model + state.submodel).length * 37;
    const price = base + car - age * 310;
    const repair = document.querySelector("input[name=repair]:checked");
    const list = {
      "Class 1": [["Comprehensive Standard", 1.0, "700,000"], ["Comprehensive Plus", 1.18, "800,000"],
                  ["Comprehensive Lady", 1.05, "700,000"]],
      "Class 2+": [["Two Plus Saver", 1.0, "300,000"], ["Two Plus Extra", 1.22, "500,000"]],
      "Class 3": [["Third Party Basic", 1.0, "-"]]
    }[state.cls];
    return list.map(([name, factor, sum]) => ({
      name, sum,
      premium: (price * factor * (repair && repair.value === "Dealer" ? 1.15 : 1)).toFixed(2),
      repair: state.cls === "Class 1" ? (repair ? repair.value : "Garage") : "Garage"
    }));
  }

  document.getElementById("get-quote").onclick = () => {
    const message = document.getElementById("message");
    const results = document.getElementById("results");
    results.innerHTML = "";
    const missing = ["cls", "year", "brand", "model", "submodel"].filter(k => !state[k]);
    if (missing.length) { message.textContent = "Please complete: " + missing.join(", "); return; }
    if (state.cls === "Class 1" && !document.querySelector("input[name=repair]:checked")) {
      message.textContent = "Please choose a repair type"; return;
    }
    message.textContent = "Finding packages...";
    setTimeout(() => {
      message.textContent = "";
      results.innerHTML = packages().map(p => `
        <article class="package-card">
          <h3>${p.name}</h3>
          <div class="premium">${Number(p.premium).toLocaleString("en-US", {minimumFractionDigits: 2})} THB / year</div>
          <div class="detail sum-insured">Sum insured: ${p.sum} THB</div>
          <div class="detail repair-type">Repair: ${p.repair}</div>
          <button data-testid="choose-package">Choose</button>
        </article>`).join("");
    }, 600);
  };

  document.getElementById("accept-cookies").onclick = () => {
    document.getElementById("cookie-banner").style.display = "none";
  };
  // The banner appears a moment after the page loads, over the form, as on many real sites
  setTimeout(() => { document.getElementById("cookie-banner").style.display = "block"; }, 700);
  draw();
</script>
</body>
</html>
