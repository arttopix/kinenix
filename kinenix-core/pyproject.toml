[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kinenix"
dynamic = ["version"]
description = "Open-source Python framework for automation flows written in Markdown: the flow runner, built-in actions, and the kinenix CLI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "arttopix" }]
keywords = ["rpa", "automation", "playwright", "workflow", "local-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "playwright>=1.40.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "requests>=2.28.0"
]

[project.optional-dependencies]
# One-command installs; all Kinenix packages are released together with the same version
hub = ["kinenix-hub>=1.0.0rc3"]
worker = ["kinenix-worker>=1.0.0rc3"]
dev = [
    "pytest>=7.0.0"
]

[project.urls]
Homepage = "https://github.com/kinenix/kinenix"
Documentation = "https://github.com/kinenix/kinenix/tree/main/docs"
Issues = "https://github.com/kinenix/kinenix/issues"

[project.scripts]
kinenix = "kinenix.cli:main"

[tool.setuptools.dynamic]
version = { attr = "kinenix.__version__" }

[tool.setuptools.packages.find]
include = ["kinenix*"]

# `kinenix init`: the new-project template, and example bundles copied from flows/examples by
# .github/scripts/sync_examples.py
[tool.setuptools.package-data]
kinenix = ["examples/**/*", "templates/**/*"]


