<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Catalog, page 2 of 2 - Kinenix Office Supply</title>
<!-- A made-up shop for the Kinenix tutorial: the products and prices are not real -->
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1d2433}
header{background:#1f3a5f;color:#fff;padding:16px 24px}header h1{margin:0;font-size:22px}
main{max-width:960px;margin:24px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.product{background:#fff;border:1px solid #dde2ea;border-radius:10px;padding:14px}
.product h3{margin:0 0 6px;font-size:16px}.category{color:#5b6475;font-size:13px}
.price{font-weight:700;margin-top:10px}.pager{margin:24px 0;display:flex;gap:12px;align-items:center}
.next{padding:8px 14px;border-radius:8px;background:#1f3a5f;color:#fff;text-decoration:none}
.next.disabled{background:#c5cbd6;pointer-events:none}.empty{padding:40px;text-align:center;color:#5b6475}
</style>
</head>
<body>
<header><h1>Kinenix Office Supply</h1></header>
<main>
  <h2>Catalog, page 2 of 2</h2>
  <div class="grid">
    <article class="product">
      <h3>Ergonomic Office Chair</h3>
      <div class="category">Furniture</div>
      <div class="price">4,990.00 THB</div>
    </article>
    <article class="product">
      <h3>Paper Shredder</h3>
      <div class="category">Machines</div>
      <div class="price">2,450.00 THB</div>
    </article>
    <article class="product">
      <h3>File Folders, Pack of 25</h3>
      <div class="category">Paper</div>
      <div class="price">129.00 THB</div>
    </article>
    <article class="product">
      <h3>Laminator, A4</h3>
      <div class="category">Machines</div>
      <div class="price">890.00 THB</div>
    </article>
  </div>
  <nav class="pager">Page 2 of 2 <a class="next disabled" aria-disabled="true">Next page</a></nav>
</main>
</body>
</html>
